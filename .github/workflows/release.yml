name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify Zero INTERNET Permission (100% Offline Audit)
        run: |
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name aapt2 | sort -V | tail -n 1)
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -qi "android.permission.INTERNET"; then
            echo "ERROR: android.permission.INTERNET detected in release APK!"
            exit 1
          fi
          if echo "$PERMS" | grep -qi "android.permission.ACCESS_NETWORK_STATE"; then
            echo "ERROR: android.permission.ACCESS_NETWORK_STATE detected in release APK!"
            exit 1
          fi
          echo "PASSED: Release APK declares zero internet/network permissions."

      - name: Prepare Release Assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v1.0.0"; fi
          cp app/build/outputs/apk/release/app-release.apk "kharjnegar-${TAG}.apk"
          sha256sum "kharjnegar-${TAG}.apk" > "kharjnegar-${TAG}.apk.sha256"
          ls -lh "kharjnegar-${TAG}.apk"*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "KharjNegar ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            kharjnegar-*.apk
            kharjnegar-*.apk.sha256
          generate_release_notes: true
